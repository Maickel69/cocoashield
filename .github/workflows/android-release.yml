name: CocoaShield Android CI/CD - Build & Release APK

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/movil-kotlin/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Publish Auto-Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔧 Permisos de ejecución para Gradle Wrapper
        run: |
          chmod +x apps/movil-kotlin/gradlew || true

      - name: 📦 Compilar APK de Release (y Debug firmado)
        working-directory: apps/movil-kotlin
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: 🔍 Extraer Versión de la Aplicación
        id: app_version
        run: |
          VERSION_NAME=$(grep "versionName" apps/movil-kotlin/app/build.gradle.kts | head -1 | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" apps/movil-kotlin/app/build.gradle.kts | head -1 | awk '{print $3}' | tr -d ' ')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Versión detectada: $VERSION_NAME (Build $VERSION_CODE)"

      - name: 📄 Actualizar version.json para In-App Auto-Update
        run: |
          cat <<EOF > apps/movil-kotlin/version.json
          {
            "versionCode": ${{ steps.app_version.outputs.version_code }},
            "versionName": "${{ steps.app_version.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.app_version.outputs.version_name }}/cocoashield-v${{ steps.app_version.outputs.version_name }}.apk",
            "releaseNotes": "CocoaShield AI v${{ steps.app_version.outputs.version_name }} — Actualización automática de alta estabilidad con soporte offline y Room DB.",
            "mandatory": false,
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          cat apps/movil-kotlin/version.json

      - name: 🏷️ Renombrar APK para Distribución
        run: |
          APK_SRC=$(find apps/movil-kotlin/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_SRC" ]; then
            # Si release requiere firma personalizada, buscar el apk generado
            APK_SRC=$(find apps/movil-kotlin/app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "APK encontrado en: $APK_SRC"
          cp "$APK_SRC" apps/movil-kotlin/cocoashield-v${{ steps.app_version.outputs.version_name }}.apk
          cp "$APK_SRC" apps/movil-kotlin/app-release.apk

      - name: 🚀 Crear GitHub Release y Adjuntar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_name }}
          name: CocoaShield AI v${{ steps.app_version.outputs.version_name }} (Build ${{ steps.app_version.outputs.version_code }})
          body: |
            ### 📱 CocoaShield AI Android Release v${{ steps.app_version.outputs.version_name }}
            
            * **Build Code:** `${{ steps.app_version.outputs.version_code }}`
            * **Arquitectura:** Kotlin Nativo con Jetpack Compose + Room Database SQLite.
            * **Modo Offline:** Detección de enfermedades con clasificador botánico integrado y sincronización en segundo plano (`WorkManager`).
            * **Actualizaciones:** Compatible con instalación sobrepuesta directa in-place (no borra los datos ni diagnósticos guardados en el teléfono).
            
            Descarga el archivo APK adjunto para instalar o actualizar en el dispositivo.
          draft: false
          prerelease: false
          files: |
            apps/movil-kotlin/cocoashield-v${{ steps.app_version.outputs.version_name }}.apk
            apps/movil-kotlin/app-release.apk
            apps/movil-kotlin/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
